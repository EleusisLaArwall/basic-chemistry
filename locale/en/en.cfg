[mod-setting-description]
bc-simple-mode=If enabled, recipes are simplified:\n[item=coal] + [fluid=water] → [item=bc-synthetic-plate]\nNo [fluid=bc-syn-gas] __FLUID__bc-syn-gas__, [fluid=bc-natural-gas] __FLUID__bc-natural-gas__ and [fluid=bc-methane-gas] __FLUID__bc-methane-gas__ are available and all Mod Settings regarding them are ignored.
bc-coal-amount=Sets distribution and amount of [item=coal] __ITEM__coal__ available on the map.
bc-syngas-ing-lqd=If enabled, [fluid=steam] __FLUID__steam__ (165°C) is used instead of [fluid=water] __FLUID__water__ in [fluid=bc-syn-gas] __FLUID__bc-syn-gas__ and [item=bc-synthetic-plate] __ITEM__bc-synthetic-bar__ recipes.
bc-electronic-circuit-ing-iron-plate-remove=If enabled, ingredient [item=iron-plate] __ITEM__iron-plate__ is removed from [item=electronic-circuit] __ITEM__electronic-circuit__ recipe.
bc-plastic-bar-ing-coal-remove=If enabled, ingredient [item=coal] __ITEM__coal__ is removed from [item=plastic-bar] __ITEM__plastic-bar__ recipe.
bc-syn-gas-plastic-bar=If enabled, ingredient [fluid=bc-syn-gas] __FLUID__bc-syn-gas__ × 10 is added to the [item=plastic-bar] __ITEM__plastic-bar__ recipe.\nAmount can be adjusted with "Full Control".
bc-natural-gas=If enabled, [fluid=bc-natural-gas] __FLUID__bc-natural-gas__ deposits will spawn on newly generated chuncks and __FLUID__bc-natural-gas__ processing is available.
bc-natural-gas-from-oil=If enabled, an additional oil processing recipe to extract [fluid=bc-natural-gas] __FLUID__bc-natural-gas__ instead of [fluid=petroleum-gas] __FLUID__petroleum-gas__ is available. __FLUID__bc-natural-gas__ processing is available.
bc-petroleum-gas-from-methane-gas=Experimental.\nIf enabled, an additional recipe to synthesize [fluid=bc-methane-gas] __FLUID__bc-methane-gas__ from [fluid=petroleum-gas] __FLUID__petroleum-gas__ is available.
#bc-syn-gas-from-wood=If enabled, an additional recipe to produce __FLUID__bc-syn-gas__ from __ITEM__wood__ is available.
#bc-rail-synthetic-plate=If enabled, __ITEM__bc-synthetic-plate__ × 1 is added to the __ITEM__rail__ recipe as an ingredient.
bc-extractor-pump=If enabled, the __ITEM__bc-extractor-pump__ (burner pumpjack) is available. Required for a Vulcanus start or if stuck there.
bc-syn-gas-icon=Choose the icon used for [fluid=bc-syn-gas] __FLUID__bc-syn-gas__.
bc-synthetic-plate-icon=Choose the icon used for [item=bc-synthetic-plate] __ITEM__bc-synthetic-plate__.
#	MOD SETTINGS FOR OTHER MODS
#	AAI
bc-aai-remove-electronic-circuit-wood=(AAI only) If enabled, the recipe for [item=electronic-circuit] __ITEM__electronic-circuit__ from [item=wood] __ITEM__wood__ is hidden.
bc-aai-remove-stone-tablet=(AAI only) If enabled, the recipe for [item=stone-tablet] __ITEM__stone-tablet__ is hidden.\n[item=electronic-circuit] __ITEM__electronic-circuit__ requires __ITEM__iron-plate__ instead.\nReverts the amount of [item=stone] __ITEM__stone__ on the map back to normal.
bc-aai-more-glass-usage=(AAI and/or CI only) More recipes require [item=glass] __ITEM__glass__ as an ingredient. Mainly [item=advanced-circuit] __ITEM__advanced-circuit__ and train-related recipes.\nIf only CI is enabled, "Sand and Glass" Setting must be enabled to take effect.
#	SCRAPPY INDUSTRY
bc-si-synthetic-scrap=(SI only) Scrap from crafting with [item=bc-synthetic-plate] __ITEM__bc-synthetic-plate__.
#	MISC
bc-fc-overwrite-methane-gas-name=[virtual-signal=signal-alert] Highly experimental! Use at your own risk.\nRequires another mod to define methane fluid!\nAll recipes from this mod use "methane" instead of "bc-methane-gas" (internal names).
bc-fc-overwrite=If enabled, overwrites all settings changed by "Full Control" with default values. Useful to restore default values when Full Control is removed or to switch between default and custom values.
#	FULL CONTROL
bc-fc-plastic-bar=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]2047[/color]\nAmount of __FLUID__bc-syn-gas__ added to __ITEM__plastic-bar__ recipe as an ingredient. This setting is ignored if "__ITEM__plastic-bar__ requires __FLUID__bc-syn-gas__" above is disabled.
bc-fc-electronic-circuit=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ITEM__electronic-circuit__ recipe as an ingredient.
bc-fc-battery=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ITEM__battery__ recipe as an ingredient.
bc-fc-transport-belt=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ENTITY__transport-belt__ recipe as an ingredient.
bc-fc-splitter=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ENTITY__splitter__ recipe as an ingredient.
bc-fc-inserter=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ENTITY__inserter__ recipe as an ingredient.
bc-fc-medium-electric-pole=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ENTITY__medium-electric-pole__ recipe as an ingredient. This setting is ignored if the mod AAI is enabled.
bc-fc-big-electric-pole=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ENTITY__big-electric-pole__ recipe as an ingredient.
bc-fc-rail=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ITEM__rail__ recipe as an ingredient.
bc-fc-assembling-machine-1=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ added to __ENTITY__assembling-machine-1__ recipe as an ingredient.
bc-fc-syn-gas-energy=(FC) min: [color=yellow]0.1[/color] | max: [color=yellow]255[/color]\nEnergy required for __FLUID__bc-syn-gas__ recipe.
bc-fc-syn-gas-coal=(FC) min: [color=yellow]1[/color] | max: [color=yellow]255[/color]\nAmount of __ITEM__coal__ used in __FLUID__bc-syn-gas__ recipe as an ingredient.\n__ITEM__bc-synthetic-plate__ recipe if "Simple Mode" is enabled.\nCrushed coal if Crushing Industry is installed.
bc-fc-ci-syn-gas-crushed-coal=(FC CI only) min: [color=yellow]1[/color] | max: [color=yellow]255[/color]\nAmount of __ITEM__crushed-coal__ used in __FLUID__bc-syn-gas__ recipe as an ingredient.
bc-fc-syn-gas-water=(FC) min: [color=yellow]1[/color] | max: [color=yellow]2047[/color]\nAmount of __FLUID__water__ used in __FLUID__bc-syn-gas__ recipe as an ingredient.\n__ITEM__bc-synthetic-plate__ recipe if "Simple Mode" is enabled.
bc-fc-syn-gas-syn-gas=(FC) min: [color=yellow]1[/color] | max: [color=yellow]2047[/color]\nAmount of __FLUID__bc-syn-gas__ produced in __FLUID__bc-syn-gas__ recipe.
bc-fc-synthetic-plate-energy=(FC) min: [color=yellow]1[/color] | max: [color=yellow]255[/color]\nEnergy required for __ITEM__bc-synthetic-plate__ recipe.
bc-fc-synthetic-plate-water=(FC) min: [color=yellow]1[/color] | max: [color=yellow]2047[/color]\nAmount of __FLUID__water__ used in __ITEM__bc-synthetic-plate__ recipe as an ingredient.
bc-fc-synthetic-plate-syn-gas=(FC) min: [color=yellow]1[/color] | max: [color=yellow]2047[/color]\nAmount of __FLUID__bc-syn-gas__ used in __ITEM__bc-synthetic-plate__ recipe as an ingredient.
bc-fc-synthetic-plate-synthetic-plate=(FC) min: [color=yellow]1[/color] | max: [color=yellow]255[/color]\nAmount of __ITEM__bc-synthetic-plate__ produced in __ITEM__bc-synthetic-plate__ recipe.
bc-fc-syn-gas-from-wood=(FC) min: [color=yellow]0[/color] (disable) | max: [color=yellow]255[/color]\nAmount of __ITEM__wood__ used in __FLUID__bc-syn-gas__ from __ITEM__wood__ recipe as an ingredient. Suggested value: 2
bc-fc-syn-gas-from-wood-water=(FC) min: [color=yellow]1[/color] | max: [color=yellow]2047[/color]\nAmount of __FLUID__water__ used in __FLUID__bc-syn-gas__ from __ITEM__wood__ recipe as an ingredient.
bc-fc-syn-gas-from-wood-syn-gas=(FC) min: [color=yellow]1[/color] | max: [color=yellow]2047[/color]\nAmount of __FLUID__bc-syn-gas__ produced in __FLUID__bc-syn-gas__ from __ITEM__wood__ recipe.
bc-fc-syn-gas-from-wood-energy=(FC) min: [color=yellow]1[/color] | max: [color=yellow]255[/color]\nEnergy required for __FLUID__bc-syn-gas__ from __ITEM__wood__ recipe.

